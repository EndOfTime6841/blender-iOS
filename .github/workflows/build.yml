name: Build Unsigned Blender iOS IPA (Manual)

# This configures the workflow to ONLY trigger manually
on:
  workflow_dispatch:

jobs:
  build-blender-ios:
    runs-on: macos-latest
    timeout-minutes: 90 # Blender is massive and can take a long time to build

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Setup Homebrew and Dependencies
        run: |
          brew install cmake git-lfs

      - name: Select Xcode Version
        run: sudo xcode-select -s /Applications/Xcode.app

      - name: Download Pre-compiled iOS Libraries
        run: |
          ./build_files/utils/make_update.py --use-ios-libraries

      - name: Generate Xcode Project via CMake
        run: |
          mkdir build_ios
          cmake -G Xcode -S . -B build_ios \
            -DCMAKE_SYSTEM_NAME=iOS \
            -DCMAKE_OSX_SYSROOT=iphoneos

      - name: Build Unsigned Archive via xcodebuild
        run: |
          cd build_ios
          xcodebuild archive \
            -project Blender.xcodeproj \
            -scheme install \
            -archivePath $RUNNER_TEMP/Blender.xcarchive \
            -sdk iphoneos \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            PROVISIONING_PROFILE_SPECIFIER=""

      - name: Package App into Unsigned IPA
        run: |
          mkdir -p $RUNNER_TEMP/Payload
          cp -R $RUNNER_TEMP/Blender.xcarchive/Products/Applications/Blender.app $RUNNER_TEMP/Payload/
          cd $RUNNER_TEMP
          zip -r Blender-iOS-Unsigned.ipa Payload

      - name: Upload Unsigned IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Blender-iPadOS-Unsigned
          path: ${{ runner.temp }}/Blender-iOS-Unsigned.ipa
          retention-days: 14
